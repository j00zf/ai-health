name: flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5

  # API Calls
  dio: ^5.9.0
  health: ^13.3.1

  # Local Storage
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.0+1

  # SQLite Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Internet Connectivity
  connectivity_plus: ^7.0.0

  # Google Sign In
  google_sign_in: ^6.2.1
  google_sign_in_android: ^6.1.20

  # JWT
  jwt_decoder: ^2.0.1

  # Date Formatting
  intl: ^0.20.2
  flutter_web_auth_2: ^4.1.0

  # Security & Loading
  flutter_secure_storage: ^9.2.2
  flutter_spinkit: ^5.2.1

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0

  # Icons
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2801.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/pulse_ai_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/