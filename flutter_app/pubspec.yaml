name: flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5

  # API Calls & Health Data
  dio: ^5.9.0
  health: ^13.3.1

  # Local Storage & Permissions
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.0+1

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Connectivity
  connectivity_plus: ^7.0.0

  # Authentication
  google_sign_in: ^6.2.1
  google_sign_in_android: ^6.1.20
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  jwt_decoder: ^2.0.1
  flutter_web_auth_2: ^4.1.0

  # Security & Storage
  flutter_secure_storage: ^9.2.2

  # UI & Icons
  flutter_spinkit: ^5.2.2
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2801.0

  # Camera & ML
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0

  # Utilities
  intl: ^0.20.2
  workmanager: ^0.10.7
  http_parser: ^4.1.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/pulse_ai_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
