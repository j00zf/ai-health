# Force Java to drop modern multiplexing that trips firewalls
systemProp.http.protocols=TLSv1.2,TLSv1.3
systemProp.https.protocols=TLSv1.2,TLSv1.3
# Prevent Java from inheriting broken Windows system proxy routes
systemProp.java.net.useSystemProxies=false
# Force IPv4 to prevent IPv6 routing mismatches
systemProp.java.net.preferIPv4Stack=true
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
